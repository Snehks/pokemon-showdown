# Daily upstream sync: merges smogon/pokemon-showdown master into a rolling
# sync branch, rebuilds dist, runs the PBO test subset, and opens/updates a PR.
#
# Design notes:
# - Pushes a REAL merge commit (never squashed) so the merge-base advances and
#   future syncs only see new upstream commits. Do not "Squash and merge" the
#   PR — use a merge commit.
# - The rolling branch `sync/upstream` is force-reset from master on every run,
#   so an unmerged PR simply gets updated with the latest state.
# - On merge conflict the run aborts and opens/updates a GitHub issue listing
#   the conflicted files for manual resolution (see "Upgrade Checklist" in
#   PBO_FORK_CHANGES.md).
# - PBO subset tests (dynahax + pbo-*) MUST pass. The full mocha suite is run
#   as informational only, because a few upstream tests fail even on a clean
#   checkout depending on environment.
# - Releasing (tagging v<base>-pbo-vNN) and re-pinning the game repo stay
#   manual, after the PR is reviewed and merged.

name: Upstream Sync

on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC daily
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: sync/upstream
      UPSTREAM_REPO: https://github.com/smogon/pokemon-showdown.git
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream master
          NEW_COMMITS=$(git rev-list --count master..upstream/master)
          echo "new_commits=$NEW_COMMITS" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$(git rev-parse --short upstream/master)" >> "$GITHUB_OUTPUT"
          echo "Upstream is $NEW_COMMITS commits ahead of master"

      - name: Stop if already up to date
        if: steps.fetch.outputs.new_commits == '0'
        run: echo "Nothing to sync." && exit 0

      - name: Configure git identity
        if: steps.fetch.outputs.new_commits != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge
        if: steps.fetch.outputs.new_commits != '0'
        id: merge
        run: |
          git checkout -B "$SYNC_BRANCH" master
          if git merge upstream/master --no-edit \
              -m "merge: sync upstream master (${{ steps.fetch.outputs.new_commits }} commits, upstream ${{ steps.fetch.outputs.upstream_head }})"; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
          fi

      - name: Open conflict issue and fail
        if: steps.merge.outputs.conflicted == 'true'
        run: |
          TITLE="Upstream sync conflict ($(date -u +%F))"
          BODY=$(printf 'Automatic merge of upstream/master (%s new commits) into master conflicted in:\n\n```\n%s\n```\n\nResolve manually per the "Upgrade Checklist" in PBO_FORK_CHANGES.md, then re-run the Upstream Sync workflow.' \
            "${{ steps.fetch.outputs.new_commits }}" "$(cat /tmp/conflicts.txt)")
          EXISTING=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create upstream-sync --description "Automated upstream sync" --color BFD4F2 || true
            gh issue create --title "$TITLE" --label upstream-sync --body "$BODY"
          fi
          exit 1

      - name: Setup Node
        if: steps.merge.outputs.conflicted == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install and rebuild dist
        if: steps.merge.outputs.conflicted == 'false'
        run: |
          npm ci
          node build
          if ! git diff --quiet -- dist; then
            git add dist
            git commit -m "build: rebuild dist after upstream sync"
          fi

      - name: PBO subset tests (must pass)
        if: steps.merge.outputs.conflicted == 'false'
        run: npx mocha test/sim/abilities/dynahax*.js test/sim/misc/pbo-*.js

      - name: Full test suite (informational)
        if: steps.merge.outputs.conflicted == 'false'
        id: fulltest
        continue-on-error: true
        run: |
          set +e
          npx mocha --timeout 8000 > /tmp/full_tests.log 2>&1
          EXIT=$?
          SUMMARY=$(grep -E "passing|failing|pending" /tmp/full_tests.log | tail -3 | tr '\n' ' ')
          echo "summary=${SUMMARY:-no summary}" >> "$GITHUB_OUTPUT"
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          tail -60 /tmp/full_tests.log
          exit 0

      - name: Push branch and open/update PR
        if: steps.merge.outputs.conflicted == 'false'
        run: |
          git push -f origin "$SYNC_BRANCH"
          BODY=$(printf 'Automated daily sync of smogon/pokemon-showdown master.\n\n- New upstream commits: %s (upstream head `%s`)\n- PBO subset tests (dynahax + pbo-*): passed\n- Full mocha suite (informational): %s\n\nReview per the "Upgrade Checklist" in PBO_FORK_CHANGES.md. **Merge with a merge commit — do not squash** (squashing breaks the merge-base for future syncs). Tagging a `-pbo-vNN` release and re-pinning the game repo remain manual steps.' \
            "${{ steps.fetch.outputs.new_commits }}" "${{ steps.fetch.outputs.upstream_head }}" "${{ steps.fulltest.outputs.summary }}")
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$BODY"
            gh pr comment "$EXISTING" --body "Updated: now ${{ steps.fetch.outputs.new_commits }} upstream commits (head ${{ steps.fetch.outputs.upstream_head }})."
          else
            gh pr create --base master --head "$SYNC_BRANCH" \
              --title "Sync upstream master (${{ steps.fetch.outputs.new_commits }} commits)" \
              --body "$BODY"
          fi
